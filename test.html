<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아우름 정기토론 신청서</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: left;
            height: 100vh;
            margin: 20px;
            font-family: Arial, sans-serif;
        }
        .box {
            width: 345px;
            height: auto;
            background-color: #d9d9d9;
            margin: 20px 0;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 300px;
            background-color: #ffffff;
            border-radius: 15px;
            margin: 10px 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .option {
            margin: 5px 0; /* 각 옵션 간의 간격 설정 */
        }
        label {
            font-size: 16px; /* 라벨 글자 크기 설정 */
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="container">
            <div class="option">
                <input type="radio" id="option1" name="vote" value="option1">
                <label for="option1">옵션 1</label>
            </div>
            <div class="option">
                <input type="radio" id="option2" name="vote" value="option2">
                <label for="option2">옵션 2</label>
            </div>
            <div class="option">
                <input type="radio" id="option3" name="vote" value="option3">
                <label for="option3">옵션 3</label>
            </div>
        </div>
    </div>
</body>
</html>
