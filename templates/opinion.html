<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURM</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: left;
            height: 100vh;
            margin: 20px;
            font-family: Arial, sans-serif;
            font-weight:600;
        }
        .box-s {
            width: 345px;
            height: 130px;
            background-color: #d9d9d9;
            margin: 10px 0;
            border-radius: 30px; /* 모서리를 둥글게 만듦 */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .box {
            width: 345px;
            height: 180px;
            background-color: #d9d9d9;
            margin: 10px 0;
            border-radius: 30px; /* 모서리를 둥글게 만듦 */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .small-title {
            font-size: 17px;
            color: #000000;
            text-align: left;
            width: 345px;
            padding-left: 30px;
        }
        .big-title {
            font-size: 30px;
            color: #000;
            text-align: left;
            width: 345px;
            padding-left: 30px;
            margin-top: 5px;
        }
        .submit-btn {
            width: 345px;
            height: 65px; /* 버튼 높이 설정 */
            background-color: #007aff; /* 버튼 색상 */
            color: white; /* 글씨 색상 */
            text-decoration: none; /* 링크의 기본 밑줄 제거 */
            border-radius: 30px; /* 모서리 둥글게 */
            cursor: pointer; /* 포인터 커서 */
            text-align: center; /* 텍스트 중앙 정렬 */
            font-size: 30px;
            line-height: 65px;
            margin-top: 5px;
            border: none;
        }
        .title {
            font-size: 17px;
            color: #000;
            text-align: left;
        }
        .container{
            width: 300px;
            height: 150px;
        }
        .options{
            padding-top: 13px;
        }
        .custom-radio {
            transform: scale(1.5); /* 원하는 크기로 조절 */
            margin-right: 10px; /* 라디오 버튼과 텍스트 간격 조정 */
        }
    </style>
</head>
<body>
    <div class="small-title">신촌 연합 토론 동아리 아우름 36기</div>
    <div class="big-title">제 5회 정기 토론회</div>

    <form id="opinionForm" action="/opinion" method="POST" >
        <div class="box-s">
            <div class="title">(발제문)</div>
        </div>
        <div class="box">
            <div class="container">
                <div class="title">논제 1 : 유명인의 사생활을 보도하는 것을 규제해야한다.</div>
                <div class="options">
                    <input type="radio" class="custom-radio" id="option1" name="vote1" value="찬성">
                    <label for="option1">찬성</label>
                </div>
                <div class="options">
                    <input type="radio" class="custom-radio" id="option2" name="vote1" value="반대">
                    <label for="option2">반대</label>
                </div>
                <div class="options">
                    <input type="radio" class="custom-radio" id="option3" name="vote1" value="사회자">
                    <label for="option2">사회자</label>
                </div>
            </div>
        </div>
        <div class="box">
            <div class="container">
                <div class="title">논제 2 : 착한 사마리아인 법을 도입해야 한다.</div>
                <div class="options">
                    <input type="radio" class="custom-radio" id="option1" name="vote2" value="찬성">
                    <label for="option1">찬성</label>
                </div>
                <div class="options">
                    <input type="radio" class="custom-radio" id="option2" name="vote2" value="반대">
                    <label for="option2">반대</label>
                </div>
                <div class="options">
                    <input type="radio" class="custom-radio" id="option3" name="vote2" value="사회자">
                    <label for="option2">사회자</label>
                </div>
            </div>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">제출하기</button>
    </form>

    <script>
        document.getElementById('submitBtn').addEventListener('click', function() {
            const vote1 = document.querySelector('input[name="vote1"]:checked');
            const vote2 = document.querySelector('input[name="vote2"]:checked');
            
            if (!vote1 || !vote2) {
                alert('입장을 선택해주세요.');
            } else {
                // 선택된 값이 있을 때 폼 제출
                document.getElementById('opinionForm').submit();
            }
        });
    </script>
</body>
</html>
