<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURM</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: left;
            height: 100vh;
            margin: 20px;
            font-family: Arial, sans-serif;
            font-weight:600;
        }
        .box {
            width: 345px;
            height: 345px;
            background-color: #d9d9d9;
            margin: 20px 0;
            border-radius: 30px; /* 모서리를 둥글게 만듦 */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .small-title {
            font-size: 17px;
            color: #000000;
        }
        .big-title {
            font-size: 30px;
            color: #000;
            padding-bottom: 10px;
        }
        .submit-btn {
            width: 345px;
            height: 65px; /* 버튼 높이 설정 */
            background-color: #007aff; /* 버튼 색상 */
            color: white; /* 글씨 색상 */
            text-decoration: none; /* 링크의 기본 밑줄 제거 */
            border-radius: 30px; /* 모서리 둥글게 */
            cursor: pointer; /* 포인터 커서 */
            text-align: center; /* 텍스트 중앙 정렬 */
            font-size: 25px;
            line-height: 65px;
            border:none;
        }
    </style>
</head>
<body>
    <div class="big-title">감사합니다 !</div>
    <div class="small-title">정상적으로 신청되었습니다.</div>
    <div class="box">
        <div class="small-title">(이미지)</div>
    </div>
    <button class="submit-btn" onclick="location.href='https://www.instagram.com/p/C88vF6-Sovh/?utm_source=ig_web_copy_link&igsh=MzRlODBiNWFlZA=='">AURM 카드뉴스 보러가기</button>
</body>
</html>
