<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>AURM</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: left;
            height: 100vh;
            margin: 50px 20px 20px 20px;
            font-family: Arial, sans-serif;
            font-weight:600;
        }
        .box {
            width: 345px;
            min-height: 345px;
            max-height: 620px;
            background-color: #d9d9d9;
            margin: 20px 0;
            border-radius: 30px; /* 모서리를 둥글게 만듦 */
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            padding: 20px 10px;
            overflow-y:auto ;
        }
        .small-title {
            font-size: 17px;
            color: #000000;
            text-align: left;
            width: 345px;
            padding-left: 30px;
        }
        .big-title {
            font-size: 30px;
            color: #000;
            text-align: left;
            width: 345px;
            padding-left: 30px;
            margin-top: 5px;
        }
        .submit-btn {
            width: 345px;
            height: 65px; /* 버튼 높이 설정 */
            background-color: #007aff; /* 버튼 색상 */
            color: white; /* 글씨 색상 */
            text-decoration: none; /* 링크의 기본 밑줄 제거 */
            border-radius: 30px; /* 모서리 둥글게 */
            cursor: pointer; /* 포인터 커서 */
            text-align: center; /* 텍스트 중앙 정렬 */
            font-size: 30px;
            line-height: 65px;
        }
        .container{
            height: 80px;
            width: 315px;
            /*background-color: #ffffff*/;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
        }
        .container-s{
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            text-align: left;
            flex-wrap: wrap;
        }
        .bar{
            height:9px;
            width: 310px;
            background-color: #ffffff;
            border-radius: 30px;
            margin-top: 15px;
            position: relative;
        }
        .range{
            height:9px;
            background-color: #007aff;
            border-radius: 30px;
            position: absolute; /* 절대 위치 지정 */
            top: 0; /* 막대 상단에 위치 */
            background-color: #007aff;
        }
        span {
            white-space: nowrap;
            font-size: 10px;
            color:#ffffff;
        }
        .entiti-box{
            width: 160px;
            height: 55px;
            background-color: #ffffff;
            border-radius: 30px; /* 모서리를 둥글게 만듦 */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            margin:5px;
        }
        #entiti-container {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap:5px;
        }

    </style>
</head>
<body>
    <div class="small-title">신촌 연합 토론 동아리 아우름 36기</div>
    <div class="big-title">제 5회 정기 토론회</div>
    <div class="box">
        <div class="container">
            <div class="container-s" style="flex-wrap: nowrap;">
                <div class="small-title" style="padding:0;">토론 + 뒷풀이 참석</div>
                <span id="text1"></span>
            </div>
            <div class="container-s" id="entiti-container"></div>
        </div>
    </div>
    <a href="/vote" class="submit-btn">확인</a>

    <script>
        const countOptions = {{ count_options | tojson }};
        const a = countOptions.option1;  // option1의 카운트를 a에 저장
        document.getElementById('text1').innerText = a + '명'; // option1의 값

        const container=document.getElementById('entiti-container');

        const option1_users = {{ option1_users | tojson }}

        for (let i = 0; i < a; i++) {
            const entitiBox = document.createElement('div');  // 새로운 div 요소 생성
            entitiBox.className = 'entiti-box';  // class 지정
            
            // option1_users 배열에서 참석자의 기수와 이름을 가져옵니다.
            const user = option1_users[i]; // i번째 사용자 정보를 가져옴
            if (user) {
                entitiBox.innerText = `${user.term} ${user.name}`; // 기수와 이름 설정
            }

            container.appendChild(entitiBox);  // container에 추가
        }

    </script>
</body>
</html>
